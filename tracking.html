<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order — LET'S TALK</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">LET'S <span>TALK</span></a>
  </div>
</header>

<section class="section">
  <div class="wrap track-box">
    <h2>Track your order</h2>
    <p style="color:#5a5a5a; font-size:0.9rem;">Enter the Order ID you received in WhatsApp.</p>
    <div class="field" style="margin-top:24px;">
      <label for="track-input">Order ID</label>
      <input type="text" id="track-input" placeholder="LT-4821">
    </div>
    <button class="btn" id="track-btn">Check status</button>

    <div id="track-result" style="margin-top:20px; display:none;">
      <p><strong id="track-item"></strong></p>
      <ul class="step-list" id="track-steps"></ul>
    </div>

    <div id="track-notfound" style="display:none; margin-top:20px; font-size:0.85rem; color:#5a5a5a;">
      Lost your tracking history, or ordering from a new device? <a href="https://wa.me/254700000000?text=Hi%2C%20I%27d%20like%20to%20check%20the%20status%20of%20my%20order." target="_blank" style="text-decoration:underline;">Tap here to ask on WhatsApp</a>.
    </div>
  </div>
</section>

<footer><div class="wrap">© 2026 LET'S TALK.</div></footer>

<script>
const STAGES = [
  { key: "placed", label: "Order placed" },
  { key: "crafting", label: "Crafting & embroidery" },
  { key: "out_for_delivery", label: "Out for delivery" },
  { key: "delivered", label: "Delivered" },
];

function renderSteps(status) {
  const idx = STAGES.findIndex((s) => s.key === status);
  const currentIndex = idx === -1 ? 0 : idx;
  const list = document.getElementById("track-steps");
  list.innerHTML = STAGES.filter((s) => s.key !== "delivered" || status === "delivered")
    .map((s, i) => {
      let cls = "";
      if (i < currentIndex || status === "delivered") cls = "done";
      else if (i === currentIndex) cls = "active";
      return `<li class="${cls}"><span class="dot"></span> ${s.label}</li>`;
    }).join("");
}

async function checkOrder(id) {
  const result = document.getElementById("track-result");
  const notFound = document.getElementById("track-notfound");

  if (backendConfigured) {
    const { data, error } = await sb.rpc("get_order_status", { order_id: id });
    if (!error && data && data.length > 0) {
      const order = data[0];
      document.getElementById("track-item").textContent = `${order.item} — #${order.id}`;
      renderSteps(order.status);
      result.style.display = "block";
      notFound.style.display = "none";
      return;
    }
  }

  // fallback: check this browser's local order history
  const orders = JSON.parse(localStorage.getItem("lt_orders") || "[]");
  const match = orders.find((o) => o.id.toUpperCase() === id);
  if (match) {
    document.getElementById("track-item").textContent = `${match.item} — #${match.id}`;
    renderSteps(match.status || "placed");
    result.style.display = "block";
    notFound.style.display = "none";
  } else {
    result.style.display = "none";
    notFound.style.display = "block";
  }
}

document.getElementById("track-btn").addEventListener("click", () => {
  const id = document.getElementById("track-input").value.trim().toUpperCase();
  if (!id) return;
  checkOrder(id);
});
</script>
</body>
</html>
