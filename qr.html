<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>QR code - Tee Talk</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/wearer.css">
<script src="js/vendor/qrcode.js"></script>
<script src="js/site-config.js"></script>
<script src="js/qr-render.js"></script>
</head>
<body>
<header class="site-header"><div class="wrap"><a href="index.html" class="logo">TEE <span>TALK</span></a></div></header>
<main class="tt-wrap">
  <h1 class="display" style="font-size:1.6rem;">QR code for printing</h1>
  <p class="tt-muted" id="target"></p>
  <div class="qr-box" id="qr"></div>
  <div class="tt-row">
    <button class="btn small" id="dl-svg">Download SVG (for the designer)</button>
    <button class="btn ghost small" id="dl-png">Download PNG (preview)</button>
  </div>
  <p class="tt-small" id="facts"></p>
  <p class="tt-small">Made on this site, no third party. Error correction level H, pure black squares, no logo. Print or embroider at about 7 cm square and test-scan it before the real run.</p>
</main>
<script>
const code = (new URLSearchParams(location.search).get("c") || "").replace(/[^a-zA-Z0-9]/g, "");
const box = document.getElementById("qr");
if (!code) { box.textContent = "No code in this link."; }
else {
  const url = scanUrl(code);
  const q = buildQr(url);
  document.getElementById("target").textContent = url;
  box.innerHTML = q.svg;
  document.getElementById("facts").textContent = q.modules + " x " + q.modules + " squares. Fewer squares = easier to stitch.";
  function save(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  document.getElementById("dl-svg").addEventListener("click", () => save(new Blob([q.svg], { type: "image/svg+xml" }), "tee-" + code + ".svg"));
  document.getElementById("dl-png").addEventListener("click", () => {
    const px = 24, c = document.createElement("canvas"); c.width = c.height = q.size * px;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.fillStyle = "#000";
    for (let r = 0; r < q.modules; r++) for (let k = 0; k < q.modules; k++) if (q.isDark(r, k)) g.fillRect((k + 4) * px, (r + 4) * px, px, px);
    c.toBlob((b) => save(b, "tee-" + code + ".png"));
  });
}
</script>
</body>
</html>
